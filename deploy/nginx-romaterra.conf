# /etc/nginx/sites-available/romaterra
# Remplacer artifact-ceramics.tn si le domaine est différent.
# HTTPS : lancer certbot (voir DEPLOIEMENT.md), il complète ce fichier automatiquement.

# ---------- Boutique : artifact-ceramics.tn ----------
server {
    listen 80;
    server_name artifact-ceramics.tn www.artifact-ceramics.tn;
    root /var/www/romaterra-shop;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Mode test : signale sans bloquer. Passer en Content-Security-Policy une fois la console propre.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://connect.facebook.net; img-src 'self' data: https://ik.imagekit.io https://www.facebook.com; connect-src 'self' https://api.artifact-ceramics.tn https://www.facebook.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' https://ik.imagekit.io; frame-ancestors 'self'" always;

    location / {
        try_files $uri /index.html;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# ---------- Dashboard admin : admin.artifact-ceramics.tn ----------
server {
    listen 80;
    server_name admin.artifact-ceramics.tn;
    root /var/www/romaterra-admin;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://ik.imagekit.io; connect-src 'self' https://api.artifact-ceramics.tn; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob: https://ik.imagekit.io; frame-ancestors 'none'" always;

    location / {
        try_files $uri /index.html;
    }
}

# ---------- API : api.artifact-ceramics.tn ----------
server {
    listen 80;
    server_name api.artifact-ceramics.tn;

    # 10 images de 5 Mo maximum (voir utils/uploadUtils.js) + marge.
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
